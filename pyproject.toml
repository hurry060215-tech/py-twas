[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytwas"
version = "0.1.0"
description = "Pure-Python reimplementation of TWAS (MetaXcan / S-PrediXcan / S-MultiXcan / PrediXcan) — transcriptome-wide association study."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Zehua Zeng", email = "starlitnightly@163.com" },
]
keywords = [
    "TWAS", "MetaXcan", "S-PrediXcan", "S-MultiXcan", "PrediXcan",
    "transcriptome-wide-association", "GWAS", "gene-expression",
    "elastic-net", "summary-statistics", "GTEx", "imputed-expression",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
examples = ["matplotlib>=3.6", "jupyter", "nbconvert"]

[project.scripts]
pytwas = "pytwas.cli:main"

[project.urls]
Homepage = "https://github.com/omicverse/py-twas"
Repository = "https://github.com/omicverse/py-twas"
Issues = "https://github.com/omicverse/py-twas/issues"
"Upstream (MetaXcan)" = "https://github.com/hakyimlab/MetaXcan"
"Upstream (omicverse)" = "https://github.com/Starlitnightly/omicverse"

[tool.setuptools.packages.find]
include = ["pytwas*"]
exclude = ["tests*", "examples*", "metaxcan-ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
]
